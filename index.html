<script>
// ====== এখানে আপনার Firebase কনফিগ বসান ======
const FB={apiKey:"AIzaSyBrMK-m1xFM_KonQEO9OKU54bGV8ZFcCsE",authDomain:"hishab-nikash-a0028.firebaseapp.com",projectId:"hishab-nikash-a0028",appId:"1:839632373374:web:7d2f8568ddfdc31b1dfa2f"};
// ==============================================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>(n<0?'−':'')+'৳'+Math.round(Math.abs(n)).toLocaleString('bn-BD');
const B=n=>n.toLocaleString('bn-BD');

const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const nm=(m,n=1)=>{const d=new Date(m+'-01T00:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const ml=m=>new Date(m+'-01T00:00').toLocaleDateString('bn-BD',{month:'long',year:'numeric'});
const CONFIGURED=FB.apiKey!=="YOUR_API_KEY";
const EMPTY=()=>({tx:[],loans:[],rem:[],bud:{},rec:[],wal:[],cc:{in:[],out:[]},prof:{}});
let S=EMPTY(),user=null,ref=null,tab='home',fT='all',fL='all',fQ='',M=today().slice(0,7),offline=false,db,auth,notified=false,inst=null,CC='',X={};
const LK='hk_local';
// ওয়ালেট: [নাম, আইকন, রঙ]
const WT={cash:['ক্যাশ','💵','#16a34a'],bkash:['বিকাশ','📱','#e2136e'],nagad:['নগদ','📱','#f26522'],rocket:['রকেট','📱','#8c3494'],upay:['উপায়','📱','#1b75bc'],tap:['ট্যাপ','📱','#00a651'],okw:['ওকে ওয়ালেট','📱','#c2185b'],sure:['শিওরক্যাশ','📱','#0d6efd'],mcash:['এমক্যাশ','📱','#ea580c'],dak:['ডাক নগদ','📮','#dc2626'],bank:['ব্যাংক অ্যাকাউন্ট','🏦','#1e3a8a'],dbbl:['ডাচ-বাংলা ব্যাংক','🏦','#0f766e'],brac:['ব্র্যাক ব্যাংক','🏦','#0369a1'],islami:['ইসলামী ব্যাংক','🏦','#15803d'],city:['সিটি ব্যাংক','🏦','#b91c1c'],card:['ডেবিট/ক্রেডিট কার্ড','💳','#334155'],sav:['ডিপিএস/সঞ্চয়','🐷','#0d9488']};
const EXP=['খাবার','বাজার','যাতায়াত','বাসা ভাড়া','বিদ্যুৎ বিল','গ্যাস/পানি','ইন্টারনেট/মোবাইল','চিকিৎসা','শিক্ষা','কেনাকাটা','পোশাক','বিনোদন','ভ্রমণ','জ্বালানি/গাড়ি','উপহার','দান/যাকাত','ঈদ/উৎসব','পরিবার','ঋণের কিস্তি','সঞ্চয়/ডিপিএস','অন্যান্য'];
const INC=['বেতন','ব্যবসা','ফ্রিলান্সিং','বোনাস','ভাড়া আয়','রেমিট্যান্স','উপহার','সুদ/লাভ','অন্যান্য'];
const CI={'খাবার':'🍚','বাজার':'🛒','যাতায়াত':'🚌','বাসা ভাড়া':'🏠','বিদ্যুৎ বিল':'💡','গ্যাস/পানি':'🔥','ইন্টারনেট/মোবাইল':'📶','চিকিৎসা':'💊','শিক্ষা':'📚','কেনাকাটা':'🛍️','পোশাক':'👕','বিনোদন':'🎬','ভ্রমণ':'✈️','জ্বালানি/গাড়ি':'⛽','উপহার':'🎁','দান/যাকাত':'🤲','ঈদ/উৎসব':'🌙','পরিবার':'👨‍👩‍👧','ঋণের কিস্তি':'💳','সঞ্চয়/ডিপিএস':'🐷','বেতন':'💼','ব্যবসা':'🏪','ফ্রিলান্সিং':'💻','বোনাস':'🎉','ভাড়া আয়':'🏘️','রেমিট্যান্স':'🌍','সুদ/লাভ':'📈','অন্যান্য':'🏷️'};
const COL=['#5b45f5','#ff5b7f','#0e9f6e','#f59e0b','#0891b2','#c026d3','#65a30d','#ea580c'];
const cats=t=>t==='in'?[...INC,...S.cc.in]:[...EXP,...S.cc.out];
const wf=id=>S.wal.find(w=>w.id===id);const wn=id=>(wf(id)||{n:'—'}).n;
const wbal=w=>(+w.o||0)+S.tx.reduce((a,t)=>a+(t.w===w.id?(t.t==='in'?t.a:-t.a):0)+(t.t==='tf'&&t.w2===w.id?t.a:0),0);

try{const t=localStorage.getItem('hk_th');if(t)document.documentElement.dataset.th=t}catch(e){}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;if(tab==='more')render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

function fix(){
  let ch=false;S.cc=S.cc||{in:[],out:[]};S.cc.in=S.cc.in||[];S.cc.out=S.cc.out||[];S.prof=S.prof||{};S.wal=S.wal||[];S.rec=S.rec||[];S.bud=S.bud||{};
  if(!S.wal.length){S.wal.push({id:'w0',t:'cash',n:'ক্যাশ',o:0});ch=true}
  S.tx.forEach(t=>{if(!t.w){t.w=S.wal[0].id;ch=true}});
  const cur=today().slice(0,7);
  S.rec.forEach(r=>{let m=r.last?nm(r.last):r.from;
    while(m<=cur){const d=m+'-'+String(Math.min(r.day,28)).padStart(2,'0');if(d>today())break;
      S.tx.push({id:uid(),t:r.k,a:r.a,c:r.c,n:'নিয়মিত',d,w:r.w||S.wal[0].id});r.last=m;m=nm(m);ch=true}});
  return ch}
function load(){try{S={...EMPTY(),...JSON.parse(localStorage.getItem(LK)||'{}')}}catch(e){}fix()}
function save(){
  if(ref)ref.set(S).catch(()=>toast('সিঙ্ক হয়নি, ইন্টারনেট চেক করুন'));
  else try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}
  render();
}
function toast(m){alert(m)}
if(CONFIGURED){
  firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.getRedirectResult().catch(()=>{});
  auth.onAuthStateChanged(u=>{user=u;
    if(u){ref=db.collection('users').doc(u.uid);
      ref.onSnapshot(d=>{if(d.exists){S={...EMPTY(),...d.data()};if(fix())ref.set(S)}else{load();ref.set(S)}render()},()=>render());
    }else{ref=null;render()}});
}else render();
function login(){const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(e=>{if(e.code!=='auth/popup-closed-by-user')auth.signInWithRedirect(p)})}
function logout(){if(confirm('লগআউট করবেন?'))auth.signOut()}
function useOffline(){offline=true;load();render()}

// ---------- calculations ----------
const paid=l=>(l.pay||[]).reduce((a,p)=>a+p.a,0);
const rest=l=>l.a-paid(l);
const sum=(a,t)=>a.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
function stats(){
  const mt=S.tx.filter(t=>t.d.startsWith(M));
  return{inc:sum(mt,'in'),ex:sum(mt,'out'),all:S.wal.reduce((a,w)=>a+wbal(w),0),
    get:S.loans.filter(l=>l.k==='gave').reduce((a,l)=>a+rest(l),0),owe:S.loans.filter(l=>l.k==='took').reduce((a,l)=>a+rest(l),0),mt}}
function alerts(){
  const out=[];
  S.loans.forEach(l=>{if(l.due&&rest(l)>0){const n=days(l.due);
    if(n<=7)out.push({n,txt:(l.k==='gave'?esc(l.p)+' এর কাছ থেকে '+N(rest(l))+' ফেরত পাওয়ার তারিখ':esc(l.p)+' কে '+N(rest(l))+' পরিশোধের তারিখ'),d:l.due})}});
  S.rem.forEach(r=>{if(!r.done){const n=days(r.d);if(n<=7)out.push({n,txt:esc(r.t),d:r.d})}});
  return out.sort((a,b)=>a.n-b.n)}
const when=n=>n<0?`${B(Math.abs(n))} দিন আগে পার হয়েছে`:n===0?'আজ':n===1?'আগামীকাল':`${B(n)} দিন পরে`;
function notify(){
  if(notified||!('Notification' in window)||Notification.permission!=='granted')return;
  notified=true;alerts().filter(x=>x.n<=1).slice(0,4).forEach(x=>{try{new Notification('হিসাব খাতা',{body:x.txt.replace(/&amp;/g,'&')+' — '+when(x.n)})}catch(e){}});
  const cm=today().slice(0,7),sp={};S.tx.filter(t=>t.t==='out'&&t.d.startsWith(cm)).forEach(t=>sp[t.c]=(sp[t.c]||0)+t.a);
  Object.entries(S.bud).forEach(([c,l])=>{if(l>0&&sp[c]>=l*.9)try{new Notification('বাজেট সতর্কতা',{body:c+' খাতে বাজেটের '+B(Math.round(sp[c]/l*100))+'% খরচ হয়েছে'})}catch(e){}})}
async function askNotif(){if(!('Notification' in window))return toast('এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই');
  const r=await Notification.requestPermission();notified=false;if(r==='granted')notify();render()}

// ---------- views ----------
const ini=()=>((S.prof.name||(user&&user.displayName)||'আ').trim()[0]||'আ');
const nameOf=()=>S.prof.name||(user&&user.displayName)||'বন্ধু';
function avatar(){return `<button class="av" onclick="tab='more';render();scrollTo(0,0)" aria-label="প্রোফাইল">${user&&user.photoURL?`<img src="${esc(user.photoURL)}" alt="">`:esc(ini())}</button>`}
function render(){

function backup(){dl('hishab-backup-'+today()+'.json',JSON.stringify(S),'application/json')}
$('#rf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const d=JSON.parse(t);if(!Array.isArray(d.tx))throw 0;if(confirm('বর্তমান ডাটা মুছে ব্যাকআপ থেকে ফেরত আনবেন?')){S={...EMPTY(),...d};fix();save()}}).catch(()=>toast('ফাইলটি সঠিক নয়'));e.target.value=''});
function wipe(){if(confirm('সব লেনদেন, ধার ও ওয়ালেট মুছে যাবে। নিশ্চিত?')&&confirm('শেষবার জিজ্ঞাসা: সত্যিই মুছবেন?')){S={...EMPTY(),prof:S.prof};fix();save()}}

// ---------- forms ----------
function sheet(h){const s=$('#sheet');s.innerHTML=`<div>${h}</div>`;s.classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
const val=i=>$('#'+i).value.trim();
const rad=(a,c,fn='')=>`<div class="tog">${a.map(([v,l])=>`<label><input type="radio" name="tt" value="${v}" ${c===v?'checked':''} ${fn}><span>${l}</span></label>`).join('')}</div>`;
const sel=(id,v)=>`<select id="${id}">${S.wal.map(w=>`<option value="${w.id}" ${w.id===v?'selected':''}>${esc(w.n)}</option>`).join('')}</select>`;
const tt=()=>document.querySelector('[name=tt]:checked').value;
function form(k,id,ty){
  if(k==='tx'){const o=S.tx.find(x=>x.id===id)||{t:ty||'out',a:'',c:'',n:'',d:today(),w:S.wal[0].id,w2:''};X=o;CC=o.c;
    sheet(`<h2>${id?'লেনদেন সম্পাদনা':'নতুন লেনদেন'}</h2>${rad([['out','ব্যয়'],['in','আয়'],['tf','ট্রান্সফার']],o.t,'onchange="fx()"')}
    <label>টাকার পরিমাণ</label><input id="a" type="number" inputmode="decimal" min="0" value="${o.a}"><div id="fx"></div>
    <label>বিবরণ (ঐচ্ছিক)</label><input id="n" value="${esc(o.n)}"><label>তারিখ</label><input id="d" type="date" value="${o.d}">
    <button class="btn" style="width:100%;margin-top:16px" onclick="addTx('${id||''}')">সংরক্ষণ করুন</button>${id?`<button class="btn red" style="width:100%;margin-top:8px" onclick="del('tx','${id}')">মুছুন</button>`:''}`);fx()}
  if(k==='loan')sheet(`<h2>ধারের হিসাব</h2>${rad([['gave','আমি দিয়েছি'],['took','আমি নিয়েছি']],'gave')}
    <label>ব্যক্তির নাম</label><input id="p" list="pl"><datalist id="pl">${[...new Set(S.loans.map(l=>l.p))].map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <label>টাকার পরিমাণ</label><input id="a" type="number" inputmode="decimal" min="0"><label>তারিখ</label><input id="d" type="date" value="${today()}">
    <label>ফেরতের তারিখ (ঐচ্ছিক, রিমাইন্ডার আসবে)</label><input id="u" type="date"><label>নোট (ঐচ্ছিক)</label><input id="n">
    <button class="btn" style="width:100%;margin-top:16px" onclick="addLoan()">সংরক্ষণ করুন</button>`);
  if(k==='rem')sheet(`<h2>নতুন রিমাইন্ডার</h2><label>কী মনে করিয়ে দেব?</label><input id="t"><label>তারিখ</label><input id="d" type="date" value="${today()}">
    <button class="btn" style="width:100%;margin-top:16px" onclick="addRem()">সংরক্ষণ করুন</button>`);
  if(k==='wal'){const o=S.wal.find(x=>x.id===id)||{t:'bkash',n:'',o:''};
    sheet(`<h2>${id?'ওয়ালেট সম্পাদনা':'নতুন ওয়ালেট'}</h2><label>ধরন</label><select id="wt">${Object.entries(WT).map(([v,x])=>`<option value="${v}" ${o.t===v?'selected':''}>${x[1]} ${x[0]}</option>`).join('')}</select>
    <label>নাম (ঐচ্ছিক — যেমন "বিকাশ পার্সোনাল")</label><input id="wn" value="${esc(o.n)}"><label>শুরুর ব্যালেন্স</label><input id="wo" type="number" inputmode="decimal" value="${o.o}">
    <button class="btn" style="width:100%;margin-top:16px" onclick="addWal('${id||''}')">সংরক্ষণ করুন</button>${id?`<button class="btn red" style="width:100%;margin-top:8px" onclick="delWal('${id}')">মুছুন</button>`:''}`)}
  if(k==='prof')sheet(`<h2>প্রোফাইল</h2><label>নাম</label><input id="pn" value="${esc(S.prof.name||(user&&user.displayName)||'')}"><label>মোবাইল নম্বর</label><input id="pp" type="tel" value="${esc(S.prof.phone||'')}">
    <button class="btn" style="width:100%;margin-top:16px" onclick="S.prof={name:val('pn'),phone:val('pp')};closeSheet();save()">সংরক্ষণ করুন</button>`)}
function fx(){const t=tt(),w=($('#w')||{}).value||X.w,w2=($('#w2')||{}).value||X.w2||(S.wal[1]||S.wal[0]).id;
  if(t==='tf'){$('#fx').innerHTML=`<label>কোথা থেকে</label>${sel('w',w)}<label>কোথায়</label>${sel('w2',w2)}`;return}
  const L=cats(t);if(!L.includes(CC))CC='';
  $('#fx').innerHTML=`<label>ওয়ালেট</label>${sel('w',w)}<label>খাত</label><div class="cg">${L.map(c=>`<button type="button" class="cc ${c===CC?'on':''}" onclick="pc(this)" data-c="${esc(c)}">${CI[c]||'🏷️'}<span>${esc(c)}</span></button>`).join('')}<button type="button" class="cc" onclick="newCat()">＋<span>নতুন</span></button></div>`}
function pc(el){CC=el.dataset.c;document.querySelectorAll('.cc').forEach(b=>b.classList.toggle('on',b===el))}
function newCat(){const n=(prompt('নতুন খাতের নাম')||'').trim();if(!n)return;const t=tt()==='in'?'in':'out';if(!cats(t).includes(n))S.cc[t].push(n);CC=n;fx()}
function addTx(id){const a=+val('a'),t=tt();if(!(a>0))return toast('সঠিক পরিমাণ দিন');
  const o={id:id||uid(),t,a,n:val('n'),d:val('d')||today(),w:val('w'),c:'',w2:''};
  if(t==='tf'){o.w2=val('w2');if(o.w===o.w2)return toast('দুটি আলাদা ওয়ালেট বাছুন')}else o.c=CC||'অন্যান্য';
  if(id)S.tx=S.tx.map(x=>x.id===id?o:x);else S.tx.push(o);closeSheet();save()}
function addWal(id){const t=val('wt'),o={id:id||uid(),t,n:val('wn')||WT[t][0],o:+val('wo')||0};
  if(id)S.wal=S.wal.map(x=>x.id===id?o:x);else S.wal.push(o);closeSheet();save()}
function delWal(id){if(S.wal.length<2)return toast('অন্তত একটি ওয়ালেট থাকতে হবে');
  if(S.tx.some(t=>t.w===id||t.w2===id))return toast('এই ওয়ালেটে লেনদেন আছে, আগে সেগুলো মুছুন');
  if(confirm('মুছে ফেলবেন?')){S.wal=S.wal.filter(x=>x.id!==id);closeSheet();save()}}
function addLoan(){const a=+val('a'),p=val('p');if(!p||!(a>0))return toast('নাম ও সঠিক পরিমাণ দিন');
  S.loans.push({id:uid(),k:tt(),p,a,d:val('d')||today(),due:val('u'),n:val('n'),pay:[]});closeSheet();notified=false;save()}
function addRem(){const t=val('t');if(!t)return toast('বিবরণ লিখুন');S.rem.push({id:uid(),t,d:val('d')||today(),done:false});closeSheet();notified=false;save()}
function payForm(id){const l=S.loans.find(x=>x.id===id);
  sheet(`<h2>${l.k==='gave'?'ফেরত পাওয়া':'পরিশোধ'} — ${esc(l.p)}</h2><div class="k">বাকি আছে ${N(rest(l))}</div>
  <label>টাকার পরিমাণ</label><input id="a" type="number" inputmode="decimal" value="${rest(l)}"><label>তারিখ</label><input id="d" type="date" value="${today()}">
  <button class="btn" style="width:100%;margin-top:16px" onclick="pay('${id}')">যোগ করুন</button>`)}
function pay(id){const l=S.loans.find(x=>x.id===id),a=Math.min(+val('a'),rest(l));if(!(a>0))return toast('সঠিক পরিমাণ দিন');(l.pay=l.pay||[]).push({a,d:val('d')||today()});closeSheet();save()}
function budForm(){sheet(`<h2>মাসিক বাজেট</h2><div class="k">খালি রাখলে বাজেট থাকবে না</div>${cats('out').map(c=>`<label>${CI[c]||'🏷️'} ${esc(c)}</label><input class="bi" data-c="${esc(c)}" type="number" inputmode="decimal" min="0" value="${S.bud[c]||''}">`).join('')}
  <button class="btn" style="width:100%;margin-top:16px" onclick="S.bud={};document.querySelectorAll('.bi').forEach(i=>{if(+i.value>0)S.bud[i.dataset.c]=+i.value});closeSheet();notified=false;save()">সংরক্ষণ করুন</button>`)}
function catForm(){const row=(t,c)=>`<div class="item" style="cursor:default"><div class="m">🏷️ ${esc(c)} <span class="k">(${t==='in'?'আয়':'ব্যয়'})</span></div><button class="x" onclick="S.cc['${t}']=S.cc['${t}'].filter(x=>x!==this.dataset.c);save();catForm()" data-c="${esc(c)}">🗑</button></div>`;
  sheet(`<h2>আমার খাত</h2>${[...S.cc.out.map(c=>row('out',c)),...S.cc.in.map(c=>row('in',c))].join('')||'<div class="empty">নিজের কোনো খাত নেই</div>'}<label>নতুন খাতের নাম</label><input id="nc">${rad([['out','ব্যয়'],['in','আয়']],'out')}
  <button class="btn" style="width:100%;margin-top:16px" onclick="const n=val('nc');if(n){S.cc[tt()].push(n);save();catForm()}">যোগ করুন</button>`)}
function recList(){sheet(`<h2>নিয়মিত লেনদেন</h2>${S.rec.map(r=>`<div class="item" style="cursor:default"><div class="dot">${CI[r.c]||'🏷️'}</div><div class="m"><div class="t">${esc(r.c||'অন্যান্য')} · ${N(r.a)}</div><div class="k">${r.k==='in'?'আয়':'ব্যয়'} · প্রতি মাসের ${B(r.day)} তারিখে · ${esc(wn(r.w))}</div></div><button class="x" onclick="del('rec','${r.id}');recList()">🗑</button></div>`).join('')||'<div class="empty">কিছু নেই</div>'}
  <h2 style="margin-top:14px">নতুন যোগ করুন</h2>${rad([['out','ব্যয়'],['in','আয়']],'out')}<label>টাকার পরিমাণ</label><input id="a" type="number" inputmode="decimal" min="0">
  <label>খাত</label><select id="c">${[...cats('out'),...cats('in')].filter((c,i,a)=>a.indexOf(c)===i).map(c=>`<option>${esc(c)}</option>`).join('')}</select><label>ওয়ালেট</label>${sel('w')}
  <label>মাসের কত তারিখে (১-২৮)</label><input id="dy" type="number" min="1" max="28" value="1"><button class="btn" style="width:100%;margin-top:16px" onclick="addRec()">যোগ করুন</button>`)}
function addRec(){const a=+val('a'),day=+val('dy');if(!(a>0)||!(day>=1&&day<=28))return toast('পরিমাণ ও সঠিক তারিখ দিন');
  S.rec.push({id:uid(),k:tt(),a,c:val('c'),w:val('w'),day,from:today().slice(0,7)});fix();closeSheet();save()}
function tog(id){const r=S.rem.find(x=>x.id===id);r.done=!r.done;save()}
function del(k,id){if(confirm('মুছে ফেলবেন?')){S[k]=S[k].filter(x=>x.id!==id);closeSheet();save()}}
</script></body></html>
